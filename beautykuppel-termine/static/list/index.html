<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Freie Termine</title>
    <link rel="stylesheet" href="./list.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="title" id="title">Eine Auswahl der naechsten freien Termine</h1>

      <div class="tableContainer">
        <div class="tableHeader">
          <div class="cell">Datum</div>
          <div class="cell">Uhrzeit</div>
          <div class="cell">Leistung</div>
          <div class="cell price">Preis</div>
          <div class="cell"></div>
        </div>

        <div class="empty" id="empty" style="display: none"></div>
        <div class="error" id="error" style="display: none"></div>

        <div class="rowsContainer" id="rows"></div>

        <div class="pagination" id="pagination" style="display: none"></div>
      </div>
    </div>

    <script type="module" src="./list.js"></script>
  </body>
</html>
