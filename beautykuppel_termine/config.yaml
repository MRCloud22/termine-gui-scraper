name: Beautykuppel Termine
slug: beautykuppel_termine
version: 0.1.60
description: Fragt freie Behandlungstermine im Beautykuppel-Shop ab, erzeugt statische Seiten (/list, /signage2) + JSON/RSS und kann optional per FTP hochladen.
url: https://github.com/MRCloud22/termine-gui-scraper
startup: services
boot: auto
arch:
  - amd64
  - aarch64
  - armv7
  - armhf
  - i386
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web UI
webui: http://[HOST]:[PORT:8099]/
options:
  refreshMinutes: 5
  overrideConfig: false
  useTodayWindow: true
  startDateTime: ""
  endDateTime: ""
  staticExportEnabled: true
  ftpEnabled: false
  ftpHost: ""
  ftpPort: 21
  ftpUser: ""
  ftpPassword: ""
  ftpSecure: false
  ftpRemotePath: "/"
schema:
  refreshMinutes: int(0,1440)
  overrideConfig: bool
  useTodayWindow: bool
  startDateTime: str?
  endDateTime: str?
  staticExportEnabled: bool
  ftpEnabled: bool
  ftpHost: str?
  ftpPort: int(1,65535)
  ftpUser: str?
  ftpPassword: password?
  ftpSecure: bool
  ftpRemotePath: str?
environment:
  PORT: "8099"
  DATA_DIR: /data
map:
  - config:rw
timezone: true
ingress: true
ingress_port: 8099
panel_title: Beautykuppel Termine
panel_icon: mdi:spa
